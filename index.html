<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Megholoh Roomstay – Paparan 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#15181c;font-family:system-ui,sans-serif;color:#eee}
#c{position:fixed;inset:0}
#tabs{position:fixed;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:4px;z-index:5;background:rgba(20,24,28,.94);padding:4px;border-radius:10px;border:1px solid #444}
#tabs button{border:0;border-radius:7px;padding:8px 18px;background:transparent;color:#ccc;font-weight:600;cursor:pointer;font-size:14px}
#tabs button.on{background:#f5a623;color:#111}
.lb{position:fixed;left:0;top:0;font-size:12px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.7);white-space:nowrap;pointer-events:none}
.lb.dim{color:#7fe3ff}.lb.fur{color:#ffd37a}.lb.door{color:#fff;background:rgba(120,70,20,.92);pointer-events:auto}
.lb.loc{color:#fff;background:#c0392b;font-weight:600;font-size:13px}
.lb button{margin-left:6px;cursor:pointer;border:0;border-radius:4px;padding:2px 8px;background:#f5a623;font-weight:600}
#panel{position:fixed;right:12px;top:64px;width:250px;background:rgba(20,24,28,.94);border:1px solid #444;border-radius:10px;font-size:13px;z-index:5}
#ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700;cursor:pointer;user-select:none}
#pb{padding:0 12px 12px}#panel.min #pb{display:none}
#panel label{display:flex;align-items:center;gap:8px;margin:6px 0}
#panel button{cursor:pointer;border:0;border-radius:6px;padding:6px 10px;background:#f5a623;font-weight:600;margin:2px 2px 2px 0}
#panel textarea{width:100%;height:150px;background:#0c0e10;color:#9f9;border:1px solid #444;font:11px monospace;box-sizing:border-box;display:none}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:6;background:rgba(0,0,0,.85);padding:18px;border-radius:10px}
</style></head><body>
<canvas id="c"></canvas><div id="msg" style="display:none"></div>
<div id="tabs"></div>
<div id="panel"><div id="ph"><span>⚙ Kawalan</span><span id="tg">–</span></div><div id="pb">
<div id="doors"></div>
<button id="vw">Pandangan luar ruang</button><br><button id="all">Buka semua</button><button id="none">Tutup semua</button><hr style="border-color:#444">
<label><input type="checkbox" id="tRoom" checked> Label saiz ruang</label>
<label><input type="checkbox" id="tFur" checked> Label perabot</label>
<label><input type="checkbox" id="tDoor" checked> Label pintu</label>
<label><input type="checkbox" id="tLoc" checked> Penanda lokasi</label>
<button id="ed">Edit JSON</button><button id="ap" style="display:none">Guna</button>
<textarea id="js" spellcheck="false"></textarea>
<small style="color:#999">Seret = tinjau sekeliling · Roda = zum · Dwi-klik pintu = buka</small></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ===== DATA JSON (koordinat meter, selepas model diluruskan dengan dinding) =====
// Pintu & perabot ialah ANGGARAN – laras melalui "Edit JSON".
const LOC={"name":"Kampung Talang Dusun","lat":null,"lng":null};
let ROOMS={
 "bilik":{"title":"Bilik","file":"roomstay.glb","rotDeg":11,"room":{"x0":-2.34,"x1":2.43,"z0":-1.74,"z1":2.23,"floorY":0.09,"ceilY":2.93},
  "doors":[{"name":"Pintu Biru (timur)","x":2.43,"z":-0.1,"rotDeg":90,"w":0.8,"h":2.0,"openDeg":95},{"name":"Pintu Biru (barat)","x":-2.34,"z":-1.2,"rotDeg":-90,"w":0.8,"h":2.0,"openDeg":95}],
  "furniture":[{"name":"Katil (anggaran)","x":-1.14,"z":-0.34,"w":2.0,"d":1.5,"h":0.5},{"name":"Perabot 2 (anggaran)","x":1.0,"z":0.2,"w":1.2,"d":0.6,"h":0.8}]},
 "dapur":{"title":"Dapur","file":"dapur.glb","rotDeg":10.5,"room":{"x0":-1.07,"x1":0.98,"z0":-0.87,"z1":0.83,"floorY":0.1,"ceilY":2.5},
  "doors":[{"name":"Pintu Dapur","x":-0.05,"z":0.83,"rotDeg":0,"w":0.9,"h":2.0,"openDeg":95}],
  "furniture":[{"name":"Kabinet/sinki (anggaran)","x":0.0,"z":-0.55,"w":1.9,"d":0.6,"h":0.9}]},
 "tandas":{"title":"Tandas","file":"tandas.glb","rotDeg":-23,"room":{"x0":-1.22,"x1":0.79,"z0":-0.74,"z1":0.57,"floorY":0.05,"ceilY":2.3},
  "doors":[{"name":"Pintu Tandas","x":-0.55,"z":0.57,"rotDeg":0,"w":0.75,"h":2.0,"openDeg":95}],
  "furniture":[{"name":"Mangkuk tandas (anggaran)","x":0.45,"z":-0.4,"w":0.4,"d":0.7,"h":0.4}]}
};
let cur='bilik',doors=[],labels=[],model=null;const cache={};
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(devicePixelRatio);R.setSize(innerWidth,innerHeight);
const S=new THREE.Scene();S.background=new THREE.Color(0x15181c);S.add(new THREE.AmbientLight(0xffffff,2.2));
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.02,100);
const OC=new OrbitControls(cam,$('c'));const ov=new THREE.Group();S.add(ov);
const M=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,side:2});
const rad=THREE.MathUtils.degToRad;

function lab(text,cls,pos,btn){const e=document.createElement('div');e.className='lb '+cls;e.textContent=text;
 if(btn){const b=document.createElement('button');b.textContent=btn.t;b.onclick=btn.f;e.appendChild(b);e.btn=b}
 document.body.appendChild(e);const o={e,pos:new THREE.Vector3(...pos),cls};labels.push(o);return o}
function line(a,b){ov.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]),new THREE.LineBasicMaterial({color:0x7fe3ff})))}

function build(){
 while(ov.children.length)ov.remove(ov.children[0]);labels.forEach(l=>l.e.remove());labels=[];doors=[];
 const C=ROOMS[cur],r=C.room,f=r.floorY,L=r.x1-r.x0,W=r.z1-r.z0,H=r.ceilY-f,o=.15,fy=f+.02;
 line([r.x0,fy,r.z1+o],[r.x1,fy,r.z1+o]);line([r.x1+o,fy,r.z0],[r.x1+o,fy,r.z1]);line([r.x0-o,f,r.z0-o],[r.x0-o,r.ceilY,r.z0-o]);
 lab(`Panjang ${L.toFixed(2)} m`,'dim room',[(r.x0+r.x1)/2,fy,r.z1+o]);lab(`Lebar ${W.toFixed(2)} m`,'dim room',[r.x1+o,fy,(r.z0+r.z1)/2]);
 lab(`Tinggi ${H.toFixed(2)} m`,'dim room',[r.x0-o,(f+r.ceilY)/2,r.z0-o]);lab(`Luas ≈ ${(L*W).toFixed(1)} m²`,'dim room',[(r.x0+r.x1)/2,fy,(r.z0+r.z1)/2]);
 C.furniture.forEach(u=>{const m=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(u.w,u.h,u.d)),new THREE.LineBasicMaterial({color:0xffd37a}));
  m.position.set(u.x,f+u.h/2,u.z);ov.add(m);lab(`${u.name} ${u.w}×${u.d}×${u.h} m`,'fur',[u.x,f+u.h+.1,u.z])});
 C.doors.forEach(d=>{const piv=new THREE.Group();piv.position.set(d.x,f,d.z);piv.rotation.y=rad(d.rotDeg);
  const p=new THREE.Mesh(new THREE.BoxGeometry(d.w,d.h,.05),M(0x8b5a2b,.75));p.position.set(d.w/2,d.h/2,0);
  const hinge=new THREE.Group();hinge.add(p);piv.add(hinge);ov.add(piv);const b=rad(d.rotDeg);
  const st={d,hinge,cur:0,tgt:0};st.tog=()=>{st.tgt=st.tgt?0:rad(d.openDeg);sync()};p.userData.tog=st.tog;
  st.l=lab(`${d.name} ${d.w}×${d.h} m`,'door',[d.x+d.w/2*Math.cos(b),f+d.h+.15,d.z-d.w/2*Math.sin(b)],{t:'Buka',f:st.tog});doors.push(st)});
 lab(`📍 ${LOC.name}`+(LOC.lat!=null?` (${LOC.lat}, ${LOC.lng})`:''),'loc',[(r.x0+r.x1)/2,r.ceilY+.4,(r.z0+r.z1)/2]);
 setView(inside);
 sync();vis()}
let inside=true;
function setView(inn){inside=inn;const r=ROOMS[cur].room,f=r.floorY,cx=(r.x0+r.x1)/2,cz=(r.z0+r.z1)/2,L=r.x1-r.x0,W=r.z1-r.z0;
 if(inn){const d=ROOMS[cur].doors[0],lx=d?d.x-cx:0,lz=d?d.z-cz:-1,n=Math.hypot(lx,lz)||1;
  cam.position.set(cx-lx/n*.3,f+1.5,cz-lz/n*.3);OC.target.set(cam.position.x+lx/n*.02,f+1.5,cam.position.z+lz/n*.02);OC.minDistance=.01;OC.enablePan=false}
 else{const d=Math.max(L,W)*1.5+1;OC.target.set(cx,f+1.1,cz);cam.position.set(cx,f+d*.9,cz+d);OC.minDistance=.3;OC.enablePan=true}
 OC.update();$('vw').textContent=inn?'Pandangan luar ruang':'Pandangan dalam ruang'}
function sync(){doors.forEach(s=>s.l.e.btn.textContent=s.tgt?'Tutup':'Buka');
 const el=$('doors');el.innerHTML='';doors.forEach(s=>{const b=document.createElement('button');b.textContent=`${s.tgt?'Tutup':'Buka'} ${s.d.name}`;b.onclick=s.tog;el.appendChild(b)})}
function vis(){const on=i=>$(i).checked;labels.forEach(l=>l.hide=(l.cls.includes('room')&&!on('tRoom'))||(l.cls==='fur'&&!on('tFur'))||(l.cls==='door'&&!on('tDoor'))||(l.cls==='loc'&&!on('tLoc')))}
['tRoom','tFur','tDoor','tLoc'].forEach(i=>$(i).onchange=vis);
$('all').onclick=()=>{doors.forEach(s=>s.tgt=rad(s.d.openDeg));sync()};$('none').onclick=()=>{doors.forEach(s=>s.tgt=0);sync()};
$('ed').onclick=()=>{$('js').value=JSON.stringify(ROOMS[cur],null,1);$('js').style.display=$('ap').style.display='block'};
$('ap').onclick=()=>{try{ROOMS[cur]=JSON.parse($('js').value);build()}catch(e){alert('JSON tidak sah: '+e.message)}};
$('vw').onclick=()=>setView(!inside);
$('ph').onclick=()=>{const m=$('panel').classList.toggle('min');$('tg').textContent=m?'+':'–'};

const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
$('c').addEventListener('dblclick',e=>{mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mv,cam);
 const h=ray.intersectObjects(ov.children,true).find(i=>i.object.userData.tog);if(h)h.object.userData.tog()});

function show(key,g){if(model)S.remove(model);const C=ROOMS[key];model=g;model.rotation.y=rad(C.rotDeg);
 model.traverse(n=>{if(n.isMesh&&n.material){n.material.side=2;n.material.metalness=0}});S.add(model);$('msg').style.display='none';build()}
function loadTab(key){cur=key;doors=[];[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.k===key));
 labels.forEach(l=>l.e.remove());labels=[];while(ov.children.length)ov.remove(ov.children[0]);
 if(cache[key])return show(key,cache[key]);
 if(model){S.remove(model);model=null}$('msg').style.display='block';$('msg').textContent='Memuatkan '+ROOMS[key].title+'…';
 new GLTFLoader().load(ROOMS[key].file,g=>{cache[key]=g.scene;if(cur===key)show(key,g.scene)},undefined,()=>{
  $('msg').innerHTML=`Tidak dapat memuat ${ROOMS[key].file} secara automatik.<br>Pilih fail .glb:<br><input type="file" id="fl" accept=".glb">`;
  $('fl').onchange=e=>new GLTFLoader().load(URL.createObjectURL(e.target.files[0]),g=>{cache[key]=g.scene;show(key,g.scene)})})}
Object.keys(ROOMS).forEach(k=>{const b=document.createElement('button');b.textContent=ROOMS[k].title;b.dataset.k=k;b.onclick=()=>loadTab(k);$('tabs').appendChild(b)});
loadTab('bilik');
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const v=new THREE.Vector3();
R.setAnimationLoop(()=>{doors.forEach(s=>{s.cur+=(s.tgt-s.cur)*.08;s.hinge.rotation.y=s.cur});OC.update();R.render(S,cam);
 labels.forEach(l=>{v.copy(l.pos).project(cam);const ok=v.z<1&&!l.hide;l.e.style.display=ok?'block':'none';
  if(ok)l.e.style.transform=`translate(-50%,-50%) translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px)`})});
</script></body></html>
